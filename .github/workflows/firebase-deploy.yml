name: Deploy to Firebase

on:
  push:
    branches:
      - firebase

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Build application
        run: pnpm build

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Validate Firebase deploy permissions
        run: |
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --non-interactive || {
            echo "::error::Firebase CLI cannot list Cloud Functions for this project. Firebase Hosting webframeworks needs Cloud Functions access for the Next.js backend; grant the deploy service account Cloud Functions permissions and ensure the Cloud Functions API is enabled."
            exit 1
          }
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Deploy Firebase Hosting and Firestore rules
        run: firebase deploy --only hosting,firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive --force
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
